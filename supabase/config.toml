# Supabase CLI config — `supabase link --project-ref <ref>` then `supabase db push` / `supabase functions deploy geesling`
project_id = "geesling"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["geesling://"]
# Geesling starts everyone with an anonymous account (saved items, walks, rate limits).
enable_anonymous_sign_ins = true

[functions.geesling]
verify_jwt = true

[functions.usage-report]
# Google Sheets calls this without a Supabase login; it checks its own secret token instead.
verify_jwt = false

[functions.daily-emails]
# Called by GitHub Actions with the service-role key (checked again inside).
verify_jwt = true

[functions.email-unsubscribe]
# Opened from links in emails, without a Supabase login; every link carries its own HMAC signature.
verify_jwt = false

[functions.email-dispatch]
# Called by a database trigger and pg_cron without a login; it only starts a GitHub run when there is real work.
verify_jwt = false
