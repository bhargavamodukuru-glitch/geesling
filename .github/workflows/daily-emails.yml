name: Daily emails

# Geesling's three daily emails, Toronto time: 9 am (what's on today), noon (a neighbourhood day under $20) and
# 5 pm (grab-and-go food under $20). GitHub schedules run in UTC, so each email has a run for daylight time (EDT,
# UTC-4) and one for standard time (EST, UTC-5); the function only sends in the right Toronto hour, and its
# idempotency keys stop a second run from sending again (supabase/functions/daily-emails).
# scripts/render-email.mjs photographs the card in headless Chrome so inboxes show Geesling's real pixel fonts; if
# that fails it sends the all-text version.
on:
  schedule:
    - cron: "0 13,14 * * *" # 9 am Toronto
    - cron: "0 16,17 * * *" # noon Toronto
    - cron: "0 21,22 * * *" # 5 pm Toronto
  workflow_dispatch:
    inputs:
      kind:
        description: "Send this email now (morning, neighbourhood or evening); empty = whichever is due"
        required: false
      test:
        description: "Send only to the owner (true/false)"
        required: false
        default: "false"

jobs:
  send:
    # Pinned: Playwright 1.55 can't install Chrome on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Playwright in its own folder (not the app's ~800 packages); the script runs from there so it finds it.
      - name: Install headless Chrome
        run: |
          mkdir -p "$RUNNER_TEMP/render" && cp scripts/render-email.mjs "$RUNNER_TEMP/render/"
          cd "$RUNNER_TEMP/render" && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Send the email that's due
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIND: ${{ github.event.inputs.kind }}
          TEST: ${{ github.event.inputs.test }}
        run: |
          node "$RUNNER_TEMP/render/render-email.mjs" ${KIND:+--kind=$KIND} $([ "$TEST" = "true" ] && echo --test)
