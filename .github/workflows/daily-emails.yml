name: Daily emails

# Geesling's three daily emails, Toronto time: 9 am (what's on today), noon (a neighbourhood day under $20) and
# 5 pm (grab-and-go food under $20). GitHub schedules run in UTC, so each email has a run for daylight time (EDT,
# UTC-4) and one for standard time (EST, UTC-5); the function only sends in the right Toronto hour, and its
# idempotency keys stop a second run from sending again (supabase/functions/daily-emails).
on:
  schedule:
    - cron: "0 13,14 * * *" # 9 am Toronto
    - cron: "0 16,17 * * *" # noon Toronto
    - cron: "0 21,22 * * *" # 5 pm Toronto
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the email that's due
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/functions/v1/daily-emails" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{}'
